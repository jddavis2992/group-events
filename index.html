<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Group Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #E4E8E6; --ink: #17212E; --muted: #55616D; --card: #F6F8F7; --line: #C6CFCC;
  --focus: #2F6FED; --warn: #B4361D;
  --hero: #2B3A4A; --hero-ink: #E6ECF1; --hero-title: #FFFFFF; --accent: #3F7FBF; --accent-ink: #FFFFFF;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E141B; --ink: #E9EEF2; --muted: #9EABB7; --card: #17212C; --line: #2A3744;
    --focus: #7FA8FF; --warn: #FF9472; --accent: #6AA6D9; --accent-ink: #0D1B28;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E141B; --ink: #E9EEF2; --muted: #9EABB7; --card: #17212C; --line: #2A3744;
  --focus: #7FA8FF; --warn: #FF9472; --accent: #6AA6D9; --accent-ink: #0D1B28;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 580px; margin: 0 auto; padding: 26px 18px 40px; }
h1, h2, h3 { font-family: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif; margin: 0; line-height: 1.08; letter-spacing: -0.02em; }
h1 { font-size: clamp(2.1rem, 10vw, 3.1rem); font-weight: 800; }
h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: 10px; }
h3 { font-size: 1.1rem; font-weight: 800; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sub { margin: 8px 0 0; color: var(--muted); font-size: 1.1rem; }
.hint { color: var(--muted); font-size: 0.92rem; margin: 6px 0 0; }
.pre { white-space: pre-line; }
.section { margin-top: 34px; }
.mt { margin-top: 18px; }
.back { display: inline-block; margin-bottom: 14px; color: var(--muted); text-decoration: none; font-weight: 600; padding: 8px 0; }
.back:hover { color: var(--ink); }
.status { min-height: 1.4em; margin-top: 10px; font-weight: 600; }
.notice { background: var(--card); border-radius: 12px; padding: 12px 14px; margin-top: 14px; border-left: 6px solid var(--accent); }
.flash { background: var(--card); border-radius: 12px; padding: 10px 14px; margin: 6px 0 4px; font-weight: 600; border-left: 6px solid var(--accent); }

/* Themes set the hero colors and the accent for picks */
.theme-default  { --hero:#2B3A4A; --hero-ink:#E6ECF1; --hero-title:#FFFFFF; --accent:#3F7FBF; --accent-ink:#FFFFFF; }
.theme-harvest  { --hero:#E8B23C; --hero-ink:#4A2336; --hero-title:#3A1828; --accent:#E8B23C; --accent-ink:#3A1828; }
.theme-bonfire  { --hero:#17212E; --hero-ink:#D3DAE1; --hero-title:#FFB98A; --accent:#F26A2E; --accent-ink:#1A0D05; }
.theme-beach    { --hero:#0F6B73; --hero-ink:#F3EBD8; --hero-title:#FFF6DF; --accent:#F4B860; --accent-ink:#0B2E33; }
.theme-holiday  { --hero:#1F4D3A; --hero-ink:#F6EEDC; --hero-title:#FFFFFF; --accent:#D94B3F; --accent-ink:#FFFFFF; }
.theme-mission  { --hero:#123B6D; --hero-ink:#E3EEF9; --hero-title:#FFFFFF; --accent:#3FB3AA; --accent-ink:#05231F; }

.hero { background: var(--hero); color: var(--hero-ink); border-radius: 18px; padding: 22px 20px 20px; }
.hero h1 { color: var(--hero-title); }
.hero p { margin: 10px 0 0; }
.hero .meta { margin-top: 14px; display: grid; gap: 2px; font-weight: 500; }
a.event { display: block; text-decoration: none; margin-top: 12px; background: var(--hero); color: var(--hero-ink); border-radius: 16px; padding: 16px 18px 15px; }
a.event h3 { color: var(--hero-title); font-size: 1.45rem; }
a.event .line { margin-top: 4px; opacity: .92; font-size: 0.95rem; }
a.event .go { margin-top: 10px; font-weight: 600; font-size: 0.95rem; }
a.event.closed { opacity: .65; }
.pill { display: inline-block; font-family: "Instrument Sans", sans-serif; letter-spacing: 0; font-size: 0.8rem; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--hero-ink); color: var(--hero); margin-left: 8px; vertical-align: middle; }

.card { background: var(--card); border-radius: 16px; padding: 16px 16px 18px; margin-top: 16px; }
.results { margin-top: 16px; border-top: 2px dashed var(--line); padding-top: 12px; }
.results h3 { font-family: "Instrument Sans", sans-serif; font-size: 0.95rem; font-weight: 600; letter-spacing: 0; color: var(--muted); margin-bottom: 4px; }

label.field, .field { display: block; font-weight: 600; margin: 14px 0 6px; }
input[type="text"], input[type="password"], input[type="number"], textarea, select {
  width: 100%; font: inherit; color: var(--ink); background: var(--bg);
  border: 2px solid var(--line); border-radius: 10px; padding: 11px 13px;
}
textarea { resize: vertical; min-height: 92px; }
input:focus, textarea:focus, select:focus { border-color: var(--focus); outline: none; }
input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); flex: none; margin: 0; }
.toggle { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
.toggle label { font-weight: 500; }

.seg { display: grid; gap: 8px; }
.seg button { font: inherit; font-weight: 600; cursor: pointer; min-height: 52px; padding: 8px 6px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); }
.seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; cursor: pointer; border-radius: 99px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); padding: 9px 14px; min-height: 44px; text-align: left; }
.chip[aria-pressed="true"], .chip[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.chip[disabled] { opacity: .45; cursor: not-allowed; }
.chip small { opacity: .8; margin-left: 2px; }
.checks { list-style: none; margin: 0; padding: 0; }
.checks li { display: flex; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.checks li:last-child { border-bottom: 0; }
.checks label { flex: 1; }
.info p { margin: 0 0 10px; white-space: pre-line; }
.links { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.links a { font-weight: 600; text-underline-offset: 3px; }

.cal-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.cal-head .t { font-weight: 600; }
.count { font-size: 0.9rem; color: var(--muted); }
.month-bar { display: flex; align-items: center; justify-content: space-between; margin: 10px 0 6px; }
.month-name { font-weight: 600; font-size: 1.05rem; }
.nav { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-size: 1.2rem; cursor: pointer; display: grid; place-items: center; flex: none; }
.nav[disabled] { opacity: .3; cursor: default; }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.dow { text-align: center; font-size: 0.8rem; color: var(--muted); padding: 4px 0; }
.day { aspect-ratio: 1 / 1; min-height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); font: inherit; font-weight: 500; cursor: pointer; display: grid; place-items: center; }
.day.off { color: var(--muted); opacity: .35; cursor: default; }
.day.ok { background: color-mix(in srgb, var(--line) 55%, transparent); }
.day.ok.wknd { box-shadow: inset 0 0 0 2px var(--line); }
.day.ok:hover { background: var(--line); }
.day.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; box-shadow: none; }
.legend { margin-top: 10px; font-size: 0.88rem; color: var(--muted); }

.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stepper { display: flex; align-items: center; gap: 14px; }
.stepper output { min-width: 1.5ch; text-align: center; font-weight: 700; font-size: 1.2rem; }
.strong { font-weight: 600; }

.btn { font: inherit; font-weight: 600; cursor: pointer; border-radius: 12px; border: 2px solid var(--ink); padding: 12px 18px; min-height: 48px; background: var(--ink); color: var(--bg); width: 100%; margin-top: 14px; }
.btn.small { width: auto; min-height: 44px; padding: 9px 16px; margin-top: 0; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.mini { min-width: 44px; min-height: 44px; border-radius: 10px; border: 2px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-weight: 600; display: inline-grid; place-items: center; padding: 0 10px; cursor: pointer; text-decoration: none; }
.mini[disabled] { opacity: .3; cursor: default; }
.linkbtn { font: inherit; background: none; border: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 10px 0; font-weight: 600; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.addrow { display: grid; gap: 8px; margin-top: 12px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin-bottom: 8px; }
.stat { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
.stat .n { font-family: "Bricolage Grotesque", sans-serif; font-size: 1.7rem; font-weight: 800; line-height: 1; }
.stat .l { font-size: 0.82rem; color: var(--muted); }
.rank, .list { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 8px; }
.rank li, .list li { background: var(--bg); border-radius: 10px; padding: 8px 12px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 600; }
.bar { height: 6px; border-radius: 3px; background: var(--line); margin: 6px 0 4px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; background: var(--accent); }
.names { font-size: 0.88rem; color: var(--muted); }
.badge { font-size: 0.8rem; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--line); color: var(--ink); white-space: nowrap; }
.badge.need { background: transparent; box-shadow: inset 0 0 0 2px var(--accent); }

.savebar { position: sticky; bottom: 0; margin: 22px -18px 0; padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 2px solid var(--line); display: flex; align-items: center; gap: 12px; }
.savebar .btn { width: auto; margin: 0; flex: none; }
.savemsg { flex: 1; font-weight: 600; font-size: 0.95rem; }
.savemsg.warn { color: var(--warn); }

details.editor { background: var(--card); border-radius: 14px; margin-top: 12px; }
details.editor summary { cursor: pointer; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 600; list-style: none; min-height: 52px; }
details.editor summary::-webkit-details-marker { display: none; }
.editor-body { padding: 0 16px 16px; }
.foot { margin-top: 48px; border-top: 2px solid var(--line); padding-top: 12px; }
.foot a { color: var(--muted); }
/* Share buttons */
.share { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.share .btn { width: auto; margin: 0; }
a.btn.small { display: inline-block; }
.btn.disabled { opacity: .45; pointer-events: none; }

/* Host tools: numbered setup steps */
.steps { margin: 8px 0 0; padding-left: 22px; }
.steps li { margin: 6px 0; }

/* Add to calendar block */
.when { font-weight: 600; font-size: 1.1rem; margin: 0; }
.calbtns { display: grid; gap: 8px; margin-top: 14px; }
a.btn { display: block; text-align: center; text-decoration: none; margin-top: 0; }
.timerow { display: flex; gap: 10px; align-items: center; }
.timerow input { flex: 1; }

/* Home page background photo */
.photo-bg { position: fixed; inset: 0; z-index: -1; background-color: #10161D; background-size: cover; background-position: center; background-repeat: no-repeat; }
.photo-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,12,18,.40) 0%, rgba(8,12,18,.68) 45%, rgba(8,12,18,.86) 100%); }
.on-photo h1, .on-photo .sub, .on-photo .section > h2, .on-photo .section > .hint, .on-photo .foot a { color: #FFFFFF; text-shadow: 0 1px 14px rgba(0,0,0,.5); }
.on-photo .sub { color: rgba(255,255,255,.9); }
.on-photo .foot { border-top-color: rgba(255,255,255,.35); }
.photo-preview { display: block; width: 100%; max-height: 180px; object-fit: cover; border-radius: 12px; margin-top: 10px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<main class="wrap" id="app"><p class="hint">Loading…</p></main>

<script>
"use strict";
(() => {
  /* ===================== Settings ===================== */
  const API_URL = "https://script.google.com/macros/s/AKfycbwDhzWhzXcnT7xexbujkGtq4WOAdaoocC9j5YV5lW-JPD42_KHgaw1N5uEB6dxGlPLS/exec";                 // Paste your Apps Script web app URL (ends in /exec). See SETUP.md.
  const DEFAULT_TITLE = "DR October 2026 Mission Trip";   // Used until the sheet's Settings tab loads
  const DEFAULT_SUB = "Planning Group Events";
  const REFRESH_MS = 45000;           // How often open pages pull in new answers

  /* ===================== Small helpers ===================== */
  const app = document.getElementById("app");
  const PROPS = new Set(["value", "checked", "disabled", "hidden", "maxLength", "selected"]);
  function h(tag, props, ...kids) {
    const e = document.createElement(tag);
    if (props) for (const k of Object.keys(props)) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else if (PROPS.has(k)) e[k] = v;
      else e.setAttribute(k, v === true ? "" : String(v));
    }
    add(e, kids);
    return e;
  }
  function add(parent, kid) {
    if (kid == null || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach(k => add(parent, k)); return; }
    parent.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); return node; }
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const clone = v => (v == null ? v : JSON.parse(JSON.stringify(v)));
  const arr = v => (Array.isArray(v) ? v.map(String) : []);
  const plural = (n, one, many) => n + " " + (n === 1 ? one : many);
  const nameKey = s => String(s || "").trim().replace(/\s+/g, " ").toLowerCase();
  const EMAIL_RE = /^[^\s@<>"',;]+@[^\s@<>"',;]+\.[^\s@<>"',;]{2,}$/;
  const clampInt = (v, lo, hi, d) => { let n = parseInt(v, 10); if (isNaN(n)) n = d; return Math.min(hi, Math.max(lo, n)); };
  const pct = f => Math.max(0, Math.min(100, Math.round(f * 100)));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage can be unavailable */ } }
  };
  const session = {
    get(k, d) { try { const v = sessionStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { /* storage can be unavailable */ } },
    del(k) { try { sessionStorage.removeItem(k); } catch (e) { /* storage can be unavailable */ } }
  };

  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  const pad = n => (n < 10 ? "0" : "") + n;
  const keyOf = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
  const parts = k => k.split("-").map(Number);
  const toDate = k => { const p = parts(k); return new Date(p[0], p[1] - 1, p[2]); };
  const pretty = k => toDate(k).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  const todayKey = () => { const n = new Date(); return keyOf(n.getFullYear(), n.getMonth() + 1, n.getDate()); };
  function monthsFrom(y, m, count) {
    const list = [];
    for (let i = 0; i < count; i++) { list.push([y, m]); m++; if (m > 12) { m = 1; y++; } }
    return list;
  }
  function monthsBetween(first, last) {
    const a = parts(first), b = parts(last);
    const count = (b[0] - a[0]) * 12 + (b[1] - a[1]) + 1;
    return monthsFrom(a[0], a[1], Math.max(1, Math.min(count, 24)));
  }

  const THEMES = [["default", "Classic"], ["harvest", "Harvest"], ["bonfire", "Bonfire night"], ["beach", "Beach day"], ["holiday", "Holiday"], ["mission", "Mission trip"]];
  const themeOf = t => (THEMES.some(x => x[0] === t) ? t : "default");

  /* ===================== Server calls ===================== */
  function apiError(message, code) { const e = new Error(message); e.api = true; e.code = code || ""; return e; }
  async function call(method, body) {
    if (!API_URL) throw apiError("This page isn’t connected to its spreadsheet yet. The host needs to finish setup.", "setup");
    const tries = method === "GET" ? 2 : 1;
    for (let attempt = 0; attempt < tries; attempt++) {
      const ctl = typeof AbortController === "function" ? new AbortController() : null;
      const timer = ctl ? setTimeout(() => ctl.abort(), 20000) : null;
      try {
        const opts = method === "GET" ? {} : { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) };
        if (ctl) opts.signal = ctl.signal;
        const url = method === "GET" ? API_URL + (API_URL.includes("?") ? "&" : "?") + "t=" + Date.now() : API_URL;
        const r = await fetch(url, opts);
        const res = await r.json();
        if (!res || res.ok !== true) throw apiError((res && res.error) || "Something went wrong. Please try again.", res && res.code);
        return res;
      } catch (err) {
        if (err.api) throw err;
        if (attempt + 1 < tries) { await wait(1500); continue; }
        throw apiError("Couldn’t reach the server. Check your connection and try again.", "network");
      } finally {
        if (timer) clearTimeout(timer);
      }
    }
  }

  /* ===================== Data ===================== */
  let data = null;      // what guests see
  let hostData = null;  // what the host sees (includes hidden items)

  function normalize(res) {
    res = res || {};
    const obj = v => (v && typeof v === "object" && !Array.isArray(v) ? v : {});
    const byOrder = (a, b) => a.order - b.order;
    const sections = (res.sections || []).map(s => ({ id: String(s.id || ""), name: String(s.name || "Untitled section"), order: Number(s.order) || 0, status: String(s.status || "active") })).filter(s => s.id).sort(byOrder);
    const events = (res.events || []).map(e => ({
      id: String(e.id || ""), sectionId: String(e.sectionId || ""), title: String(e.title || "Untitled event"), theme: themeOf(e.theme),
      description: String(e.description || ""), location: String(e.location || ""), time: String(e.time || ""),
      order: Number(e.order) || 0, status: String(e.status || "open")
    })).filter(e => e.id).sort(byOrder);
    const blocks = (res.blocks || []).map(b => ({ id: String(b.id || ""), eventId: String(b.eventId || ""), type: String(b.type || ""), title: String(b.title || ""), order: Number(b.order) || 0, config: obj(b.config) }))
      .filter(b => b.id && TYPES[b.type]).sort(byOrder);
    const answers = (res.answers || []).map(a => ({ blockId: String(a.blockId || ""), name: String(a.name || ""), key: nameKey(a.name), answer: obj(a.answer) })).filter(a => a.blockId && a.name);
    const rowsBy = {};
    answers.forEach(a => { (rowsBy[a.blockId] = rowsBy[a.blockId] || []).push(a); });
    return {
      error: "", settings: obj(res.settings), sections, events, blocks, answers,
      contacts: obj(res.contacts), lastReminders: obj(res.lastReminders), mailQuota: res.mailQuota == null ? null : Number(res.mailQuota),
      groupme: obj(res.groupme), lastGroupMe: obj(res.lastGroupMe),
      event: id => events.find(e => e.id === id) || null,
      blocksOf: id => blocks.filter(b => b.eventId === id),
      rowsOf: id => rowsBy[id] || []
    };
  }
  async function refreshData() {
    try { data = normalize(await call("GET")); return true; }
    catch (err) { if (!data) { data = normalize({}); data.error = err.message; } return false; }
  }
  const siteTitle = () => (data && data.settings.siteTitle) || DEFAULT_TITLE;
  const siteSub = () => (data && data.settings.siteSub) || DEFAULT_SUB;

  /* Home page background photo: a file in the same folder as index.html, or an https:// link */
  const PHOTO_RE = /^(https:\/\/[^\s"'()\\<>]+|[\w\-./]+\.(jpe?g|png|webp|avif|gif))$/i;
  let photoEl = null;
  function setPhoto(src, focus) {
    const ok = !!src && PHOTO_RE.test(src);
    app.classList.toggle("on-photo", ok);
    if (!ok) { if (photoEl) photoEl.hidden = true; return; }
    if (!photoEl) { photoEl = h("div", { class: "photo-bg", "aria-hidden": "true" }); document.body.insertBefore(photoEl, document.body.firstChild); }
    photoEl.hidden = false;
    photoEl.style.backgroundImage = `url("${src}")`;

  function mountCal(mount, cfg) {

  /* ===================== Calendar helpers (Add to calendar block) ===================== */
  const TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
  const ZONE_RE = /^[A-Za-z_]+(\/[A-Za-z0-9_+\-]+){0,2}$/;
  const ZONES = [["America/New_York", "Eastern"], ["America/Chicago", "Central"], ["America/Denver", "Mountain"], ["America/Phoenix", "Arizona"],
    ["America/Los_Angeles", "Pacific"], ["America/Anchorage", "Alaska"], ["Pacific/Honolulu", "Hawaii"], ["America/Puerto_Rico", "Atlantic (Puerto Rico)"],
    ["America/Santo_Domingo", "Dominican Republic"]];
  const ALERTS = [["week", "1 week before"], ["day", "1 day before"], ["morning", "Morning of, 9 AM"], ["2h", "2 hours before"], ["30m", "30 minutes before"]];
  const ALERT_WORDS = { week: "a week before", day: "the day before", morning: "the morning of", "2h": "2 hours before", "30m": "30 minutes before" };
  const deviceZone = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) { return ""; } };
  function zoneOk(tz) {
    if (!tz || !ZONE_RE.test(tz)) return false;
    try { new Intl.DateTimeFormat("en-US", { timeZone: tz }); return true; } catch (e) { return false; }
  }
  const zoneLabel = tz => { const z = ZONES.find(x => x[0] === tz); return z ? z[1] : tz.split("/").pop().replace(/_/g, " "); };
  function zoneOffsetMin(utcMs, tz) {
    const f = new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
    const p = {};
    f.formatToParts(new Date(utcMs)).forEach(x => { p[x.type] = x.value; });
    return (Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second) - utcMs) / 60000;
  }
  function zonedUtc(dateKey, time, tz) {
    const [y, m, d] = parts(dateKey), [hh, mm] = time.split(":").map(Number);
    const guess = Date.UTC(y, m - 1, d, hh, mm);
    const first = guess - zoneOffsetMin(guess, tz) * 60000;
    return guess - zoneOffsetMin(first, tz) * 60000;
  }
  const addDays = (k, n) => { const d = toDate(k); d.setDate(d.getDate() + n); return keyOf(d.getFullYear(), d.getMonth() + 1, d.getDate()); };
  // Works out the event's start and end from the block settings. Returns null until a date is set.
  function calTimes(c) {
    c = c || {};
    if (!DATE_RE.test(String(c.date || ""))) return null;
    const lastDay = DATE_RE.test(String(c.endDate || "")) && c.endDate > c.date ? c.endDate : c.date;
    if (!TIME_RE.test(String(c.start || ""))) return { allDay: true, start: c.date, endExcl: addDays(lastDay, 1) };
    const st = c.start;
    let ek = lastDay, et = TIME_RE.test(String(c.end || "")) ? c.end : "";
    if (!et) {
      if (lastDay > c.date) et = st;
      else {
        const [sh, sm] = st.split(":").map(Number), total = sh * 60 + sm + 120;
        ek = total >= 1440 ? addDays(c.date, 1) : c.date;
        et = pad(Math.floor((total % 1440) / 60)) + ":" + pad(total % 60);
      }
    } else if (ek === c.date && et <= st) ek = addDays(c.date, 1); // ends after midnight
    const tz = zoneOk(c.timeZone) ? c.timeZone : "";
    return { allDay: false, startKey: c.date, startTime: st, endKey: ek, endTime: et, tz,
      startUtc: tz ? zonedUtc(c.date, st, tz) : null, endUtc: tz ? zonedUtc(ek, et, tz) : null };
  }
  function fmtTime(t) {
    const [hh, mm] = t.split(":").map(Number);
    return new Date(2000, 0, 1, hh, mm).toLocaleTimeString("en-US", mm ? { hour: "numeric", minute: "2-digit" } : { hour: "numeric" });
  }
  function calWhen(c) {
    const t = calTimes(c);
    if (!t) return "";
    if (t.allDay) { const last = addDays(t.endExcl, -1); return last === t.start ? pretty(t.start) : `${pretty(t.start)} to ${pretty(last)}`; }
    let s = `${pretty(t.startKey)}, ${fmtTime(t.startTime)}`;
    if (TIME_RE.test(String(c.end || "")) || t.endKey !== t.startKey) s += t.endKey === t.startKey ? ` to ${fmtTime(t.endTime)}` : ` to ${pretty(t.endKey)}, ${fmtTime(t.endTime)}`;
    if (t.tz && t.tz !== deviceZone()) s += ` (${zoneLabel(t.tz)} time)`;
    return s;
  }
  function activeAlerts(c, t) {
    const ok = t.allDay ? ["week", "day", "morning"] : ["week", "day", "2h", "30m"].concat(t.tz && t.startTime > "09:00" ? ["morning"] : []);
    return ALERTS.map(a => a[0]).filter(k => arr(c.alerts).includes(k) && ok.includes(k));
  }
  const utcStamp = ms => new Date(ms).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const floatStamp = (k, t) => k.replace(/-/g, "") + "T" + t.replace(":", "") + "00";
  const dateStamp = k => k.replace(/-/g, "");
  const icsEscape = s => String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
  function icsFold(line) {
    const out = [];
    while (line.length > 60) { out.push(line.slice(0, 60)); line = " " + line.slice(60); } // stays under the 75-byte limit
    out.push(line);
    return out.join("\r\n");
  }
  function calendarFile(block, ev, link) {
    const c = block.config, t = calTimes(c);
    const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Group Events Planner//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "BEGIN:VEVENT",
      `UID:${block.id}@group-events-planner`, "DTSTAMP:" + utcStamp(Date.now())];
    if (t.allDay) L.push("DTSTART;VALUE=DATE:" + dateStamp(t.start), "DTEND;VALUE=DATE:" + dateStamp(t.endExcl));
    else if (t.tz) L.push("DTSTART:" + utcStamp(t.startUtc), "DTEND:" + utcStamp(t.endUtc));
    else L.push("DTSTART:" + floatStamp(t.startKey, t.startTime), "DTEND:" + floatStamp(t.endKey, t.endTime));
    L.push("SUMMARY:" + icsEscape(ev.title));
    if (ev.location) L.push("LOCATION:" + icsEscape(ev.location));
    L.push("DESCRIPTION:" + icsEscape([c.notes, link].filter(Boolean).join("\n\n")));
    if (link) L.push("URL:" + link);
    const triggers = { week: t.allDay ? "-P6DT15H" : "-P7D", day: t.allDay ? "-PT15H" : "-P1D", "2h": "-PT2H", "30m": "-PT30M" };
    activeAlerts(c, t).forEach(k => {
      const trig = k === "morning" ? (t.allDay ? "TRIGGER:PT9H" : "TRIGGER;VALUE=DATE-TIME:" + utcStamp(zonedUtc(t.startKey, "09:00", t.tz))) : "TRIGGER:" + triggers[k];
      L.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEscape(ev.title), trig, "END:VALARM");
    });
    L.push("END:VEVENT", "END:VCALENDAR");
    return L.map(icsFold).join("\r\n") + "\r\n";
  }
  function googleCalLink(block, ev, link) {
    const c = block.config, t = calTimes(c);
    const dates = t.allDay ? `${dateStamp(t.start)}/${dateStamp(t.endExcl)}`
      : t.tz ? `${utcStamp(t.startUtc)}/${utcStamp(t.endUtc)}` : `${floatStamp(t.startKey, t.startTime)}/${floatStamp(t.endKey, t.endTime)}`;
    const q = new URLSearchParams({ action: "TEMPLATE", text: ev.title, dates, details: [c.notes, link].filter(Boolean).join("\n\n") });
    if (ev.location) q.set("location", ev.location);
    return "https://calendar.google.com/calendar/render?" + q.toString();
  }
  const eventLink = ev => location.href.split("#")[0] + "#/e/" + encodeURIComponent(ev.id);
  // Opens WhatsApp (app on phones, WhatsApp Web on computers) with the message filled in.
  const whatsappLink = text => "https://wa.me/?text=" + encodeURIComponent(text);
  async function copyText(text) {
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) { /* fall through */ }
    try {
      const ta = h("textarea", { style: "position:fixed;top:-1000px;opacity:0", "aria-hidden": "true" });
      ta.value = text; document.body.appendChild(ta); ta.select();
      const ok = document.execCommand && document.execCommand("copy");

      return !!ok;
    } catch (e) { return false; }
  }
  function calTextFor(ev, source) {
    const b = (source || data).blocksOf(ev.id).find(x => x.type === "calendar" && DATE_RE.test(String(x.config.date || "")));
    return b ? calWhen(b.config) : "";
  }

  /* ===================== Block types =====================
   * Each type can define:
   *   label, hint          shown in host tools
   *   fields               settings the host can edit (see fieldEditor for kinds)
   *   defaults()           starting settings
   *   display(block)       for read-only blocks (no answers)
   *   respond(block, answer, set, ctx)   the input guests use; call set(newAnswer) on change
   *   check(answer, block) return a message if the answer isn't ready to save
   *   results(block, rows) the summary everyone sees
   * To add a new type, add an entry here and the matching rules in Code.gs.
   */
  const TYPES = {
    info: {
      label: "Info", hint: "Details, instructions, or links. No answers needed.",
      fields: [
        { key: "text", kind: "textarea", label: "Text" },
        { key: "links", kind: "links", label: "Links, one per line, like: Packing list | https://example.com" }
      ],
      defaults: () => ({ text: "", links: [] }),
      display(block) {
        const c = block.config;
        const paras = String(c.text || "").split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
        const links = (Array.isArray(c.links) ? c.links : []).filter(l => l && /^https?:\/\//i.test(String(l.url || "")));
        return h("div", { class: "info" }, paras.map(p => h("p", null, p)),
          links.length ? h("ul", { class: "links" }, links.map(l => h("li", null, h("a", { href: String(l.url), target: "_blank", rel: "noopener noreferrer" }, String(l.label || l.url))))) : null);
      }
    },

    rsvp: {
      label: "RSVP", hint: "Going, maybe, or can’t make it, plus extra guests.",
      fields: [
        { key: "allowMaybe", kind: "toggle", label: "Offer a Maybe option" },
        { key: "allowGuests", kind: "toggle", label: "Let people bring extra guests" },
        { key: "maxGuests", kind: "number", label: "Most extra guests per person", min: 0, max: 20 }
      ],
      defaults: () => ({ allowMaybe: true, allowGuests: true, maxGuests: 5 }),
      respond(block, ans, set) {
        const c = block.config;
        const a = { status: String((ans && ans.status) || ""), guests: clampInt(ans && ans.guests, 0, 20, 0) };
        const opts = [["yes", "I’m going"]].concat(c.allowMaybe !== false ? [["maybe", "Maybe"]] : []).concat([["no", "Can’t make it"]]);
        const max = c.allowGuests !== false ? clampInt(c.maxGuests, 0, 20, 5) : 0;
        const emit = () => { set({ status: a.status, guests: a.guests }); draw(); };
        const btns = opts.map(([v, l]) => h("button", { type: "button", role: "radio", onclick: () => { a.status = v; if (v === "no") a.guests = 0; emit(); } }, l));
        const out = h("output", { "aria-live": "polite" }, "0");
        const guests = h("div", { class: "row", style: "margin-top:14px" },
          h("div", null, h("div", { class: "strong" }, "Extra guests"), h("div", { class: "hint", style: "margin:0" }, "Not counting you")),
          h("div", { class: "stepper" },
            h("button", { type: "button", class: "nav", "aria-label": "Fewer guests", onclick: () => { a.guests = Math.max(0, a.guests - 1); emit(); } }, "−"),
            out,
            h("button", { type: "button", class: "nav", "aria-label": "More guests", onclick: () => { a.guests = Math.min(max, a.guests + 1); emit(); } }, "+")));
        function draw() {
          btns.forEach((b, i) => b.setAttribute("aria-checked", opts[i][0] === a.status ? "true" : "false"));
          guests.hidden = !(max > 0 && (a.status === "yes" || a.status === "maybe"));
          out.textContent = String(a.guests);
        }
        draw();
        return h("div", null, h("div", { class: "seg", role: "radiogroup", "aria-label": block.title || "RSVP", style: `grid-template-columns:repeat(${opts.length},1fr)` }, btns), guests);
      },
      check: (a, block) => (a && a.status ? "" : `Choose whether you can make it in “${block.title || "RSVP"}.”`),
      results(block, rows) {
        const by = s => rows.filter(r => r.answer.status === s);
        const guestsOf = r => clampInt(r.answer.guests, 0, 20, 0);
        const people = list => list.reduce((n, r) => n + 1 + guestsOf(r), 0);
        const label = r => r.name + (guestsOf(r) ? ` +${guestsOf(r)}` : "");
        const yes = by("yes"), maybe = by("maybe"), no = by("no");
        const tiles = [[people(yes), "going"]].concat(block.config.allowMaybe !== false ? [[people(maybe), "maybe"]] : []).concat([[no.length, "can’t make it"]]);
        const groups = [["Going", yes], ["Maybe", maybe], ["Can’t make it", no]].filter(g => g[1].length);
        return h("div", null, stats(tiles), h("ul", { class: "list" }, groups.map(([l, list]) => row(l, String(list.length), h("div", { class: "names" }, list.map(label).join(", "))))));

    dates: {
      label: "Date picker", hint: "People tap the days that work for them.",
      fields: [
        { key: "days", kind: "days", label: "Date options" },
        { key: "multi", kind: "toggle", label: "Let people pick more than one day" }
      ],
      defaults: () => ({ days: [], multi: true }),
      respond(block, ans, set) {
        const days = arr(block.config.days).filter(d => DATE_RE.test(d)).sort();
        if (!days.length) return h("p", { class: "hint" }, "Date options are coming soon.");

          onChange: () => set({ days: [...sel].sort() }), legend: "Outlined days are weekends."
        });
        return mount;
      },
      results(block, rows) {
        const counts = {};
        rows.forEach(r => arr(r.answer.days).forEach(d => { if (DATE_RE.test(d)) (counts[d] = counts[d] || []).push(r.name); }));
        const days = Object.keys(counts).sort((a, b) => counts[b].length - counts[a].length || (a < b ? -1 : 1));
        if (!days.length) return h("p", { class: "hint" }, "No days picked yet.");
        const max = counts[days[0]].length;
        return h("ul", { class: "rank" }, days.map(d => h("li", null,

    poll: {

        const emit = () => set({ choices: options.filter(o => a.choices.includes(o)), other: a.other });

          type: "button", class: "chip", role: multi ? null : "radio",

            meter(who[i].length / max), who[i].length ? h("div", { class: "names" }, who[i].join(", ")) : null))),
          others.length ? h("ul", { class: "list", style: "margin-top:8px" }, others.map(r => row(String(r.answer.other), "Other", h("div", { class: "names" }, r.name)))) : null);

    signup: {
      label: "Sign-up list", hint: "Things to bring or jobs to cover. Optionally cap how many people can take each one.",
      fields: [{ key: "items", kind: "slots", label: "Items, one per line. Add x2 at the end to cap it at 2 people." }],
      defaults: () => ({ items: [{ label: "Main dish", slots: 0 }, { label: "Side", slots: 0 }, { label: "Dessert", slots: 0 }, { label: "Drinks", slots: 0 }] }),
      respond(block, ans, set, ctx) {
        const items = (Array.isArray(block.config.items) ? block.config.items : []).filter(it => it && it.label);
        const mine = new Set(arr(ans && ans.items));
        const taken = it => ctx.rows().filter(r => r.key !== ctx.me() && arr(r.answer.items).includes(it.label)).length;
        const full = it => it.slots > 0 && taken(it) >= it.slots;

          const small = h("small");

            type: "button", class: "chip",
            onclick: () => {
              if (mine.has(it.label)) mine.delete(it.label);

    let nameInput = null, welcome = null, emailInput = null, emailDirty = false;
    if (open && answerable.length) {
      nameInput = h("input", { type: "text", id: "f-name", maxLength: 60, autocomplete: "name", placeholder: "First and last name", value: state.name });

      add(root, card);

      const slot = h("div"), res = h("div", { class: "results" });
      add(card, [slot, res]);
      let input = null;
      const ctx = { me: () => nameKey(state.name), rows: () => data.rowsOf(block.id) };
      const set = a => { state.answers[block.id] = a; state.dirty.add(block.id); markDirty(); };
      function reload() { if (!open) return; clear(slot); input = T.respond(block, state.answers[block.id], set, ctx); add(slot, input); }
      function refresh() {
        clear(res);
        const rows = data.rowsOf(block.id);
        if (!rows.length) { add(res, h("p", { class: "hint", style: "margin:0" }, "No responses yet.")); return; }
        add(res, [h("h3", null, plural(rows.length, "response", "responses")), T.results(block, rows)]);

    function applyName() {
      const k = nameKey(state.name);
      let found = 0;
      cards.forEach(c => {
        if (TYPES[c.block.type].display) return;
        const prior = k ? data.rowsOf(c.block.id).find(r => r.key === k) : null;
        if (prior) found++;
        if (state.dirty.has(c.block.id)) { c.live(); return; }
        const next = prior ? clone(prior.answer) : undefined;

      const email = emailInput ? emailInput.value.trim() : "";

      if (!state.dirty.size && !(emailDirty && email)) { saveMsg.textContent = "Nothing new to save."; saveMsg.classList.remove("warn"); return; }
      const answers = {};
      for (const bid of state.dirty) {
        const block = blocks.find(b => b.id === bid);
        const T = TYPES[block.type];
        const msg = T.check ? T.check(state.answers[bid], block) : "";
        if (msg) {

          const el = document.getElementById("b-" + bid);
          if (el) el.scrollIntoView({ block: "center" });

        answers[bid] = state.answers[bid] || {};

      saving = true; saveBtn.disabled = true;
      saveMsg.classList.remove("warn"); saveMsg.textContent = "Saving…";
      try {
        await call("POST", { action: "respond", eventId: ev.id, name: state.name, answers, email: email || undefined });

      } finally {
        saving = false; saveBtn.disabled = false;
      }
    }

  function fieldEditor(fd, v, uid) {
    const id = `fe-${uid}-${fd.key}`;
    const lines = s => String(s || "").split("\n").map(x => x.trim()).filter(Boolean);
    if (fd.kind === "toggle") {
      const cb = h("input", { type: "checkbox", id, checked: v === undefined ? false : !!v });
      return { key: fd.key, el: h("div", { class: "toggle" }, cb, h("label", { for: id }, fd.label)), read: () => cb.checked };
    }
    if (fd.kind === "number") {
      const inp = h("input", { type: "number", id, min: fd.min, max: fd.max, inputmode: "numeric", value: String(v == null ? fd.min : v) });
      return { key: fd.key, el: [label(fd.label, id), inp], read: () => clampInt(inp.value, fd.min, fd.max, fd.min) };
    }
    if (fd.kind === "text") {
      const inp = h("input", { type: "text", id, maxLength: 200, value: String(v || "") });
      return { key: fd.key, el: [label(fd.label, id), inp], read: () => inp.value.trim() };
    }
    if (fd.kind === "textarea") {
      const ta = h("textarea", { id, maxLength: 3000, value: String(v || "") });
      return { key: fd.key, el: [label(fd.label, id), ta], read: () => ta.value };
    }
    if (fd.kind === "lines") {
      const ta = h("textarea", { id, value: arr(v).join("\n") });
      return { key: fd.key, el: [label(fd.label, id), ta], read: () => [...new Set(lines(ta.value))] };
    }
    if (fd.kind === "slots") {
      const items = Array.isArray(v) ? v : [];
      const ta = h("textarea", { id, value: items.map(it => (it.slots ? `${it.label} x${it.slots}` : it.label)).join("\n") });
      return { key: fd.key, el: [label(fd.label, id), ta], read: () => lines(ta.value).map(l => {
        const m = l.match(/^(.*?)\s+x\s*(\d+)$/i);
        return m ? { label: m[1].trim(), slots: Number(m[2]) } : { label: l, slots: 0 };
      }).filter(x => x.label) };
    }
    if (fd.kind === "links") {
      const items = Array.isArray(v) ? v : [];
      const ta = h("textarea", { id, value: items.map(l => `${l.label} | ${l.url}`).join("\n") });
      return { key: fd.key, el: [label(fd.label, id), ta], read: () => lines(ta.value).map(l => {
        const i = l.lastIndexOf("|");
        const lab = i >= 0 ? l.slice(0, i).trim() : "", url = (i >= 0 ? l.slice(i + 1) : l).trim();
        return { label: lab || url, url };
      }).filter(x => /^https?:\/\//i.test(x.url)) };
    }
    if (fd.kind === "days") {
      const sel = new Set(arr(v).filter(d => DATE_RE.test(d)));
      const now = new Date();
      let y = now.getFullYear(), m = now.getMonth() + 1;
      const first = [...sel].sort()[0];
      if (first) { const p = parts(first); if (p[0] < y || (p[0] === y && p[1] < m)) { y = p[0]; m = p[1]; } }
      const mount = h("div");
      const tk = todayKey();
      mountCal(mount, { title: "Date options", months: monthsFrom(y, m, 18), allowed: k => k >= tk || sel.has(k), selected: sel, legend: "Tap every date you’re considering. Pick one if the date is set." });
      return { key: fd.key, el: [h("div", { class: "field" }, fd.label), mount], read: () => [...sel].sort() };
    }
    if (fd.kind === "day") {
      const sel = new Set(DATE_RE.test(String(v || "")) ? [String(v)] : []);
      const mount = h("div", { style: "margin-top:14px" });
      const tk = todayKey();
      const draw = () => {
        const now = new Date();
        let y = now.getFullYear(), m = now.getMonth() + 1;
        const first = [...sel][0];
        if (first) { const p = parts(first); if (p[0] < y || (p[0] === y && p[1] < m)) { y = p[0]; m = p[1]; } }
        mountCal(mount, { title: fd.label, months: monthsFrom(y, m, 18), allowed: k => k >= tk || sel.has(k), selected: sel, single: true, legend: "Tap a day to pick it. Tap it again to clear it." });
      };
      draw();
      return { key: fd.key, el: mount, read: () => [...sel][0] || "", set: k => { sel.clear(); if (k) sel.add(k); draw(); } };
    }
    if (fd.kind === "time") {
      const inp = h("input", { type: "time", id, step: 300, value: TIME_RE.test(String(v || "")) ? String(v) : "" });
      const clearBtn = h("button", { type: "button", class: "linkbtn", onclick: () => { inp.value = ""; } }, "Clear");
      return { key: fd.key, el: [label(fd.label, id), h("div", { class: "timerow" }, inp, clearBtn)], read: () => { const t = String(inp.value || "").slice(0, 5); return TIME_RE.test(t) ? t : ""; } };
    }
    if (fd.kind === "zone") {
      const opts = ZONES.slice(), dz = deviceZone(), cur = String(v || "");
      if (zoneOk(dz) && !opts.some(o => o[0] === dz)) opts.unshift([dz, zoneLabel(dz) + " (this device)"]);
      if (zoneOk(cur) && !opts.some(o => o[0] === cur)) opts.unshift([cur, zoneLabel(cur)]);
      const sel = select(opts, zoneOk(cur) ? cur : (zoneOk(dz) ? dz : "America/New_York"), id);
      return { key: fd.key, el: [label(fd.label, id), sel], read: () => sel.value };
    }
    if (fd.kind === "choices") {
      const on = new Set(arr(v));
      const boxes = fd.options.map(([k, l]) => {
        const cid = `${id}-${k}`;
        const cb = h("input", { type: "checkbox", id: cid, checked: on.has(k) });
        return { k, cb, el: h("div", { class: "toggle", style: "margin-top:8px" }, cb, h("label", { for: cid }, l)) };
      });
      return { key: fd.key, el: [h("div", { class: "field" }, fd.label), boxes.map(x => x.el)], read: () => boxes.filter(x => x.cb.checked).map(x => x.k) };
    }
    return { key: fd.key, el: null, read: () => v };
  }

  /* ===================== Router ===================== */
  let current = null, routeSeq = 0, lastHash = location.hash || "#/", skipGuard = false;
  function route() {
    const seq = ++routeSeq;
    setPhoto(null);
    const hash = location.hash || "#/";
    let m, result;
    if (hash === "#/host") result = viewHost(seq);
    else if ((m = hash.match(/^#\/host\/e\/(.+)$/))) result = viewHostEvent(decodeURIComponent(m[1]), seq);
    else if ((m = hash.match(/^#\/e\/(.+)$/))) result = viewEvent(decodeURIComponent(m[1]));
    else result = viewHome();
    current = null;
    Promise.resolve(result).then(v => { if (seq === routeSeq) current = v || null; });
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", () => {
    if (skipGuard) { skipGuard = false; lastHash = location.hash || "#/"; return; }
    if (current && current.dirty && current.dirty() && !confirm("You have unsaved answers. Leave this page anyway?")) {
      skipGuard = true; location.hash = lastHash; return;
    }
    lastHash = location.hash || "#/";
    route();
  });
  window.addEventListener("beforeunload", e => {
    if (current && current.dirty && current.dirty()) { e.preventDefault(); e.returnValue = ""; }
  });

  /* ===================== Start ===================== */
  refreshData().then(route);
  setInterval(async () => {
    if (document.hidden || !API_URL || (location.hash || "").startsWith("#/host")) return;
    if (await refreshData() && current && current.refresh) current.refresh();
  }, REFRESH_MS);
})();
</script>
